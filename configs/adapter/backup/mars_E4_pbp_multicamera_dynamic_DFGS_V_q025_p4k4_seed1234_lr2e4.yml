# Paired MARS E4: same model/training settings as random baseline, Stage-2 sampler only changes.
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'ViT-B-16'
  STRIDE_SIZE: [16, 16]
  ID_LOSS_WEIGHT: 0.25
  TRIPLET_LOSS_WEIGHT: 1.0
  I2T_LOSS_WEIGHT: 1.0
  I2T_WEIGHT: 1.0
  T2I_WEIGHT: 1.0
  VIFI_WEIGHT: 'pretrained/vifi/vifi_clip_k400_for_vsla.pth'
  STAGE1_WEIGHT: 'output/reproduce/mars_vifi_pbp_p4k4_seed1234_lr2e4/ViT-B-16_stage1_120.pth'
  USE_VIFI_WEIGHT: True
  PROMPT_LEN: 8
  USE_LEARNABLE_PROMPT: True
  PBP_CAMERA: True
  PBP_VIEW: False
  PBP_PROMPT_DEEP: 3
  PBP_PROMPT_LEN: 16
  USE_ADAPTER: True
  USE_IFA: True
  USE_CFAA: True
  ADAPTER_TYPE: 'dat_and_cross'

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.485, 0.456, 0.406]
  PIXEL_STD: [0.229, 0.224, 0.225]

DATALOADER:
  SAMPLER: 'mixed_dfgs_baseline_k4'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8
  SEQ_LEN: 8
  PID_SAMPLES_PER_EPOCH: 4
  DFGS_GRAPH: ''
  DFGS_PROBABILITY: 0.25
  DYNAMIC_DFGS_ENABLED: True
  DYNAMIC_DFGS_UPDATE_PERIOD: 10
  DYNAMIC_DFGS_SKIP: 2
  DYNAMIC_DFGS_NEIGHBORS: 10
  DYNAMIC_DFGS_QUALITY_WEIGHTED: False
  DYNAMIC_DFGS_RELIABLE_NEGATIVES: True
  DYNAMIC_DFGS_STRATIFIED_TWO_CAMERA: False
  DYNAMIC_DFGS_STRATIFIED_MULTICAMERA: True
  DYNAMIC_DFGS_MIN_OBSERVED_CAMERAS: 2
  DYNAMIC_DFGS_MIN_LOW_CAMERA_FRACTION: 0.5
  DYNAMIC_DFGS_CANDIDATE_POOL: 30
  DYNAMIC_DFGS_LOW_QUALITY_FRACTION: 0.20
  DYNAMIC_DFGS_BATCH_SIZE: 8
  DYNAMIC_DFGS_NUM_WORKERS: 8
  DYNAMIC_DFGS_SAVE_GRAPHS: True

SOLVER:
  SEED: 1234
  STAGE1:
    IMS_PER_BATCH: 32
    OPTIMIZER_NAME: 'Adam'
    BASE_LR: 0.00035
    WARMUP_LR_INIT: 0.00001
    LR_MIN: 1e-6
    WARMUP_METHOD: 'linear'
    WEIGHT_DECAY: 1e-4
    WEIGHT_DECAY_BIAS: 1e-4
    MAX_EPOCHS: 120
    CHECKPOINT_PERIOD: 120
    LOG_PERIOD: 10
    WARMUP_EPOCHS: 5
  STAGE2:
    IMS_PER_BATCH: 16
    OPTIMIZER_NAME: 'Adam'
    BASE_LR: 0.0002
    WARMUP_METHOD: 'linear'
    WARMUP_ITERS: 10
    WARMUP_FACTOR: 0.1
    WEIGHT_DECAY: 0.00025
    WEIGHT_DECAY_BIAS: 0.0001
    LARGE_FC_LR: False
    MAX_EPOCHS: 120
    CHECKPOINT_PERIOD: 120
    LOG_PERIOD: 50
    EVAL_PERIOD: 10
    BIAS_LR_FACTOR: 2
    STEPS: [60, 90]
    GAMMA: 0.1

TEST:
  EVAL: True
  IMS_PER_BATCH: 4
  RE_RANKING: False
  WEIGHT: 'output/innovation/mars_E4_pbp_multicamera_dynamic_DFGS_V_q025_p4k4_seed1234_lr2e4/ViT-B-16_mAP_best.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'
  ALL_FRAMES: False
  DISTANCE: 'cosine'

DATASETS:
  NAMES: 'mars'
  ROOT_DIR: '../datas/MARS'

OUTPUT_DIR: 'output/innovation/mars_E4_pbp_multicamera_dynamic_DFGS_V_q025_p4k4_seed1234_lr2e4'
